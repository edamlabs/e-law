[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "e-law"
dynamic = ["version"]
description = "Checks a project against its law"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ruff>=0.17.6", "ty>=0.0.112", "tach>=0.35.3", "prek>=0.5.4"]

[tool.maturin]
bindings = "bin"
manifest-path = "crates/law-cli/Cargo.toml"
module-name = "e_law"
python-source = "python"
strip = true
include = [{ path = "catalogues/**/*", format = "sdist" }]
