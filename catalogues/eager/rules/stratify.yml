- id: stratify.entity-companions
  message: "an entity past its measure becomes a package: `<kind>s/<name>/<kind>.py` beside its `models.py`; the fix moves the module and its imports, its companions go to `models.py` by hand"
  tags: {law: "1", set: OST, principle: Rooted}
  scope:
    exclude: *reserved
  severity: warning
  check: {engine: metric, kinds: [driver, adapter, engine, processor], measure: companions, over: companions, relocate: package}
  fix: {safety: unsafe}
  cases:
    valid:
      - path: src/pkg/engines/cache.py
        code: |
          class C0Engine: ...

          class Row0: ...

          class Row1: ...

          class Row2: ...

      - path: src/pkg/processors/scan/graph.py
        code: "class ScanProcessor: ...\n"
    invalid:
      - path: src/pkg/engines/cache.py
        code: &companions |
          class Row0: ...

          class Row1: ...

          class Row2: ...

          class Row3: ...

    fixed:
      - files:
          src/pkg/engines/cache.py: *companions
          src/pkg/app.py: "import pkg.engines.cache as cache\n\nrow = cache.Row0\n"
        expect:
          src/pkg/engines/cache/engine.py: *companions
          src/pkg/app.py: "import pkg.engines.cache.engine as cache\n\nrow = cache.Row0\n"

- id: stratify.part-units
  message: "a part past its measure becomes a folder, one unit a file"
