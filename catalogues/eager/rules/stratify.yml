- id: stratify.one-unit
  message: "a file of a `models/` or `nodes/` folder holds one unit: one class a file"
  tags: {law: "1", set: OST, principle: Rooted}
  scope: {}
  severity: warning
  check: {engine: metric, kinds: [unit], measure: classes, over: units}
  fix: {safety: none, reason: "a split, not a move"}
