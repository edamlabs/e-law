name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt · clippy · test · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941  # v2.89.1
        with:
          tool: cargo-deny
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Tools
        run: |
          uv tool install ruff==0.17.6
          uv tool install ty==0.0.112
          uv tool install tach==0.35.3
          uv python install 3.14
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Gate
        shell: bash
        run: make check 2>&1 | tee gate.log
      - name: No skipped proof
        run: "! grep -E '^SKIP: (ruff|ty|tach|uv-managed python)' gate.log"
